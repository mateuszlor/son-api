name: Guardrails

on:
  pull_request:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify AI attribution in commits
        run: |
          set -e
          missing=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q "Co-authored-by:"; then
              echo "Missing AI attribution in commit $sha"
              missing=1
            fi
          done
          exit $missing
