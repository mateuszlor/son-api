services:
  son-api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8000}
      - SON_PANEL_URL=${SON_PANEL_URL}
      - SON_LOGIN=${SON_LOGIN}
      - SON_PASSWORD=${SON_PASSWORD}
      - SON_OUT_DIR=/app/invoices
    volumes:
      - son_data:/app/invoices
    restart: unless-stopped

volumes:
  son_data:
