services:
  son-api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8000}
      - SON_OUT_DIR=/app/invoices
    volumes:
      - son_data:/app/invoices
      - ./.env:/app/.env:ro
    restart: unless-stopped

volumes:
  son_data:
